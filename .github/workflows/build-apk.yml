name: Build APK
on:
  workflow_dispatch:
    inputs:
      app_id:
        description: app id
        required: true
      app_name:
        description: app name
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_ID: ${{ inputs.app_id }}
      APP_NAME: ${{ inputs.app_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare Capacitor project
        run: |
          mkdir -p www
          cp "apps/$APP_ID/index.html" www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "$APP_NAME" "com.factory.$APP_ID" --web-dir www
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.app_id }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
